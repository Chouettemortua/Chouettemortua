name: Metrics
on:
  # Met à jour l'image toutes les 12 heures
  schedule: [{cron: "0 */12 * * *"}]
  # Permet de lancer la mise à jour manuellement
  workflow_dispatch:
jobs:
  github-metrics:
    runs-on: ubuntu-latest
    steps:
      - uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          user: Chouettemortua
          template: classic
          base: header, activity, community, repositories, metadata
          # C'est cette ligne qui permet de compter tes projets privés !
          repositories_affiliations: owner, collaborator, organization_member
