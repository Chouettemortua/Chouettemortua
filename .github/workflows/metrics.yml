name: Metrics
on:
  # Met à jour l'image toutes les 12 heures
  schedule: [{cron: "0 */12 * * *"}]
  # Permet de lancer la mise à jour manuellement
  workflow_dispatch:
jobs:
  github-metrics:
    runs-on: ubuntu-latest
    steps:
      - uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          user: Chouettemortua
          template: classic
          
          # 1. On ne garde que l'en-tête (avatar/nom) et l'activité (commits)
          base: header, activity
        
          # 2. On ajoute un beau graphique pour tes langages
          plugin_languages: yes
          plugin_languages_limit: 4
          
          # 3. Paramètre pour les dépôts privés
          repositories_affiliations: owner, collaborator, organization_member
